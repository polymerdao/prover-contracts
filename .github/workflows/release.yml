name: Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Contract unit tests (both profiles)
        run: make test

      - name: Build & package deploy artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make release

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          files: release/**
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          token: ${{ github.token }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Update Go Registry
        run: |
          GOPROXY=proxy.golang.org go list -m github.com/polymerdao/prover-contracts@${GITHUB_REF#refs/tags/}
