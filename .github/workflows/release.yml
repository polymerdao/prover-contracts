name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: 'recursive'

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Contract unit tests (both profiles)
        run: make test

      - name: Build & package deploy artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: make release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deploy-artifacts
          path: release

  release:
    runs-on: ubuntu-latest
    needs: artifacts
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: deploy-artifacts
          path: ./release

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/**
          generate_release_notes: true
          draft: false
          prerelease: true
          token: ${{ secrets.RELEASE_TOKEN }}

  registries:
    runs-on: ubuntu-latest
    environment: release
    needs: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Get Latest Version
        id: version
        uses: pozetroninc/github-action-get-latest-release@master
        with:
          repository: ${{ github.repository }}

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21.3'

      - name: Setup Foundry
        uses: foundry-rs/foundry-toolchain@v1

      # Ensure /v4 is updated as the major version changes
      - name: Update Go Registry
        run: |
          GOPROXY=proxy.golang.org go list \
          -m github.com/polymerdao/prover-contracts@${{ steps.version.outputs.release }}
