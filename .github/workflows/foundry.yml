name: Foundry

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Check contract sizes (prove_api, default profile)
        run: forge build contracts/core/prove_api --sizes --deny-warnings

      - name: Check contract sizes (native_fallback, native profile)
        run: FOUNDRY_PROFILE=native forge build contracts/core/native_fallback --sizes --deny-warnings

      - name: Tests (incl. deep fuzz + invariant campaign, both profiles)
        run: make fuzz
